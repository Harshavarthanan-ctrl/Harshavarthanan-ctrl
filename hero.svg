<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>

  <circle cx="180" cy="130" r="140" fill="#38BDF8" opacity=".10" filter="url(#glow)">
    <animate attributeName="cx" values="180;220;180" dur="12s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1400" cy="450" r="170" fill="#8B5CF6" opacity=".10" filter="url(#glow)">
    <animate attributeName="cy" values="450;420;450" dur="10s" repeatCount="indefinite"/>
  </circle>

  <rect x="60" y="50" width="1480" height="500" rx="30"
        fill="white" fill-opacity=".06"
        stroke="white" stroke-opacity=".15"/>

  <g opacity=".12" stroke="#38BDF8">
    <line x1="1180" y1="170" x2="1280" y2="120"/>
    <line x1="1280" y1="120" x2="1400" y2="210"/>
    <line x1="1280" y1="120" x2="1330" y2="320"/>
    <line x1="1330" y1="320" x2="1460" y2="420"/>
    <circle cx="1180" cy="170" r="5" fill="#38BDF8"/>
    <circle cx="1280" cy="120" r="5" fill="#8B5CF6"/>
    <circle cx="1400" cy="210" r="5" fill="#38BDF8"/>
    <circle cx="1330" cy="320" r="5" fill="#8B5CF6"/>
    <circle cx="1460" cy="420" r="5" fill="#38BDF8"/>
  </g>

  <circle cx="250" cy="300" r="102" fill="none" stroke="url(#title)" stroke-width="5">
    <animateTransform attributeName="transform"
      type="rotate" from="0 250 300" to="360 250 300"
      dur="12s" repeatCount="indefinite"/>
  </circle>

  <circle cx="250" cy="300" r="82" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".3"/>
  <text x="250" y="308" fill="#CBD5E1" text-anchor="middle"
        font-family="Segoe UI" font-size="24">PHOTO</text>

  <text x="410" y="150" fill="#CBD5E1"
        font-family="Segoe UI" font-size="22">👋 Hello, I'm</text>

  <text x="410" y="220" fill="url(#title)"
        font-family="Segoe UI" font-size="60" font-weight="700">
    Harshavarthanan
  </text>

  <text x="410" y="265" fill="#F8FAFC"
        font-family="Segoe UI" font-size="24">
    Artificial Intelligence • Machine Learning • Data Science
  </text>

  <text x="410" y="310" fill="#94A3B8"
        font-family="Segoe UI" font-size="20">
    Building AI products that solve real-world problems.
  </text>

  <g font-family="Segoe UI" font-size="16">
    <rect x="410" y="350" width="120" height="42" rx="12"
          fill="white" fill-opacity=".08" stroke="#38BDF8" stroke-opacity=".35"/>
    <text x="470" y="377" text-anchor="middle" fill="#38BDF8">Portfolio</text>

    <rect x="550" y="350" width="120" height="42" rx="12"
          fill="white" fill-opacity=".08" stroke="#38BDF8" stroke-opacity=".35"/>
    <text x="610" y="377" text-anchor="middle" fill="#38BDF8">GitHub</text>

    <rect x="690" y="350" width="120" height="42" rx="12"
          fill="white" fill-opacity=".08" stroke="#38BDF8" stroke-opacity=".35"/>
    <text x="750" y="377" text-anchor="middle" fill="#38BDF8">LinkedIn</text>
  </g>

  <g font-family="Segoe UI" font-size="15">
    <rect x="410" y="435" rx="14" width="80" height="32" fill="#38BDF8" fill-opacity=".12"/>
    <text x="450" y="456" fill="#E2E8F0" text-anchor="middle">Python</text>

    <rect x="500" y="435" rx="14" width="60" height="32" fill="#8B5CF6" fill-opacity=".12"/>
    <text x="530" y="456" fill="#E2E8F0" text-anchor="middle">SQL</text>

    <rect x="570" y="435" rx="14" width="100" height="32" fill="#38BDF8" fill-opacity=".12"/>
    <text x="620" y="456" fill="#E2E8F0" text-anchor="middle">Snowflake</text>

    <rect x="680" y="435" rx="14" width="80" height="32" fill="#8B5CF6" fill-opacity=".12"/>
    <text x="720" y="456" fill="#E2E8F0" text-anchor="middle">FastAPI</text>

    <rect x="770" y="435" rx="14" width="110" height="32" fill="#38BDF8" fill-opacity=".12"/>
    <text x="825" y="456" fill="#E2E8F0" text-anchor="middle">TensorFlow</text>

    <rect x="890" y="435" rx="14" width="70" height="32" fill="#8B5CF6" fill-opacity=".12"/>
    <text x="925" y="456" fill="#E2E8F0" text-anchor="middle">React</text>
  </g>
</svg>
